<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSBU Quiz - Kartičkový Systém</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            width: 100%;
        }

        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .course-selector {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            justify-content: center;
            margin-bottom: 30px;
        }

        .course-btn {
            padding: 12px 20px;
            border: 2px solid white;
            background: rgba(255,255,255,0.2);
            color: white;
            cursor: pointer;
            border-radius: 25px;
            font-size: 1em;
            transition: all 0.3s ease;
            font-weight: 500;
        }

        .course-btn:hover {
            background: rgba(255,255,255,0.4);
            transform: translateY(-2px);
        }

        .course-btn.active {
            background: white;
            color: #667eea;
            font-weight: bold;
        }

        .card-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            min-height: 500px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-header {
            margin-bottom: 30px;
        }

        .card-title {
            color: #667eea;
            font-size: 1.8em;
            margin-bottom: 5px;
        }

        .card-info {
            color: #999;
            font-size: 0.95em;
        }

        .question-counter {
            display: inline-block;
            background: #667eea;
            color: white;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            margin-left: 10px;
        }

        .question-text {
            font-size: 1.3em;
            color: #333;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        .answer-container {
            background: #f0f0f0;
            border-radius: 10px;
            padding: 20px;
            min-height: 100px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
        }

        .answer-container::before {
            content: 'Klikni na odpoveď →';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #999;
            font-size: 0.9em;
            text-align: center;
            width: 100%;
        }

        .answer-container.revealed::before {
            display: none;
        }

        .answer-container:not(.revealed) {
            background: linear-gradient(135deg, #e0e0e0, #f5f5f5);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 120px;
        }

        .answer-container:not(.revealed):hover {
            background: linear-gradient(135deg, #d0d0d0, #e5e5e5);
            transform: scale(1.02);
        }

        .answer-text {
            color: #333;
            font-size: 1.1em;
            line-height: 1.8;
            display: none;
        }

        .answer-container.revealed .answer-text {
            display: block;
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 40px;
            gap: 10px;
        }

        .nav-btn {
            padding: 12px 25px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1em;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .nav-btn:hover:not(:disabled) {
            background: #764ba2;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .nav-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .nav-info {
            color: #666;
            font-weight: 500;
            min-width: 120px;
            text-align: center;
        }

        .progress-bar {
            width: 100%;
            height: 4px;
            background: #e0e0e0;
            border-radius: 2px;
            overflow: hidden;
            margin-bottom: 30px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            transition: width 0.3s ease;
        }

        .keyboard-hint {
            text-align: center;
            color: #999;
            font-size: 0.85em;
            margin-top: 20px;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.8em;
            }

            .card-container {
                padding: 20px;
                min-height: 400px;
            }

            .question-text {
                font-size: 1.1em;
            }

            .course-selector {
                gap: 8px;
            }

            .course-btn {
                padding: 10px 15px;
                font-size: 0.9em;
            }

            .navigation {
                flex-direction: column;
            }

            .nav-btn {
                width: 100%;
            }
        }
    </style>
</head>

    <div class="container">
        <div class="header">
            <h1>📚 SSBU Quiz</h1>
            <p>Testovací kartičkový systém pre prípravu na skúšku</p>
        </div>

        <div class="course-selector" id="courseSelector"></div>

        <div class="card-container">

            </div>

            <div class="question-text" id="questionText"></div>

            <div class="answer-container" id="answerContainer">
                <div class="answer-text" id="answerText"></div>
            </div>

            <div class="navigation">
                <button class="nav-btn" id="prevBtn">← Predchádzajúca</button>
                <div class="nav-info" id="navInfo"></div>
                <button class="nav-btn" id="nextBtn">Ďalšia →</button>
            </div>

            <div class="keyboard-hint">
                💡 Tipy: Klikni na odpoveď aby sa odkryla | Použi šípky ← → na navigáciu
            </div>
        </div>
    </div>

        let currentCourse = null;

        // Inicializácia
        function init() {
            populateCourseBtns();
            selectCourse('Prednáška 1');
        }

        // Naplnenie tlačidiel kurzov
        function populateCourseBtns() {
            const selector = document.getElementById('courseSelector');
            Object.keys(quizData).forEach(course => {
                const btn = document.createElement('button');
                btn.className = 'course-btn';
                btn.textContent = course;
                btn.onclick = () => selectCourse(course);
                selector.appendChild(btn);
            });
        }

        // Výber kurzu
        function selectCourse(course) {
            currentCourse = course;
            currentQuestion = 0;
            updateCourseButtons();
            displayQuestion();
        }

        // Aktualizácia aktívneho tlačidla
        function updateCourseButtons() {
            document.querySelectorAll('.course-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.textContent === currentCourse) {
                    btn.classList.add('active');
                }
            });
        }

        // Zobrazenie otázky
        function displayQuestion() {
            const course = quizData[currentCourse];
            const question = course.questions[currentQuestion];
            
            document.getElementById('courseTitle').textContent = course.title;
            document.getElementById('questionText').textContent = `${currentQuestion + 1}. ${question.q}`;
            document.getElementById('answerText').textContent = question.a;
            
            const total = course.questions.length;
            document.getElementById('questionCounter').textContent = `${currentQuestion + 1}/${total}`;
            document.getElementById('navInfo').textContent = `${currentQuestion + 1} z ${total}`;
            
            // Progress bar
            const progress = ((currentQuestion + 1) / total) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
            
            // Skrytie odpovede
            document.getElementById('answerContainer').classList.remove('revealed');
            
            // Update tlačidiel
            document.getElementById('prevBtn').disabled = currentQuestion === 0;
            document.getElementById('nextBtn').disabled = currentQuestion === total - 1;
        }

        // Navigácia
        document.getElementById('prevBtn').onclick = () => {
            if (currentQuestion > 0) {
                currentQuestion--;
                displayQuestion();
            }
        };

        document.getElementById('nextBtn').onclick = () => {
            const total = quizData[currentCourse].questions.length;
            if (currentQuestion < total - 1) {
                currentQuestion++;
                displayQuestion();
            }
        };

        // Kliknutie na odpoveď
        document.getElementById('answerContainer').onclick = () => {
            document.getElementById('answerContainer').classList.add('revealed');
        };

        // Klávesové skratky
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowLeft') document.getElementById('prevBtn').click();
            if (e.key === 'ArrowRight') document.getElementById('nextBtn').click();
        });

        // Start
        init();
    </script>
